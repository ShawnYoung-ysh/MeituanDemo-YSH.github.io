<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="校园跑腿互助平台：虚构数据、本机记录的校园互助演示。">
  <meta name="application-version" content="v0.7.0-rc.1">
  <title>校园跑腿互助平台</title>
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/app.css">
  <link rel="stylesheet" href="./assets/css/mobile.css">
  <script type="module" src="./assets/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳转到主要内容</a>
  <div id="app" class="shell">
    <header class="header">
      <a class="brand" href="#/hall">校园跑腿互助平台</a>
      <details class="showcase-menu">
        <summary class="showcase-shortcut" aria-label="样例，按状态浏览">样例</summary>
        <div class="showcase-menu-panel" role="group" aria-label="样例状态"></div>
      </details>
    </header>
    <div id="session-banner"></div>
    <dialog id="intro" class="confirm-dialog intro-dialog" aria-labelledby="intro-title" aria-describedby="intro-description">
      <span class="intro-symbol" aria-hidden="true">你好</span>
      <h2 id="intro-title">欢迎体验校园互助</h2>
      <p id="intro-description">这里的学校、用户和任务都是虚构的，没有真实认证或支付。记录仅属于当前浏览器；存储可用时刷新后可以继续。</p>
      <p id="intro-storage-warning" class="field-hint" hidden>当前浏览器无法保存记录，本次确认仅在当前页面有效，重新打开可能再次显示。</p>
      <p id="intro-error" class="feedback feedback-error" role="alert" hidden></p>
      <button id="intro-confirm" class="button" type="button" autofocus>了解，开始体验</button>
    </dialog>
    <dialog id="showcase-intro" class="confirm-dialog intro-dialog" aria-labelledby="showcase-intro-title" aria-describedby="showcase-intro-description">
      <h2 id="showcase-intro-title">固定样例 · 仅供浏览</h2>
      <p id="showcase-intro-description">这里的状态与时间均为固定案例，不随实际日期变化。不会读取、重置或改动你的体验记录。</p>
      <button id="showcase-confirm" class="button" type="button" autofocus>了解，浏览样例</button>
    </dialog>
    <p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>
    <main id="main-content" tabindex="-1"><p class="loading" role="status">正在加载本机演示记录…</p></main>
    <noscript><p class="notice">此演示需要 JavaScript。请在浏览器设置中启用后重新加载。</p></noscript>
    <nav class="bottom-nav" aria-label="主导航">
      <a href="#/hall" data-page="hall">任务大厅</a>
      <a href="#/publish" data-page="publish">发布</a>
      <a href="#/tasks" data-page="tasks">我的任务</a>
      <a href="#/me" data-page="me">我的</a>
    </nav>
  </div>
</body>
</html>
